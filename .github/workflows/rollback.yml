name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão para rollback (ex: v1.0.0)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da tag informada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "package.json não encontrado — pulando npm install"
          fi

      - name: Executar testes na versão de rollback
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "package.json não encontrado — pulando testes"
          fi

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy de rollback na Vercel (Produção)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Registrar rollback no log
        run: |
          echo "Rollback executado para a tag ${{ github.event.inputs.tag }} em $(date -u '+%Y-%m-%dT%H:%M:%SZ') por ${{ github.actor }}"

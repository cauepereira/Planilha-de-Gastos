name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão para rollback (ex: v1.0.0)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da tag informada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Executar testes na versão de rollback
        run: npm test

      - name: Deploy de rollback na Vercel (Produção)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Registrar rollback no log
        run: |
          echo "Rollback executado para a tag ${{ github.event.inputs.tag }} em $(date -u '+%Y-%m-%dT%H:%M:%SZ') por ${{ github.actor }}"
